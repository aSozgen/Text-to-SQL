server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

llm:
  service:
    url: ${LLM_URL}
    endpoint: /predict
    read-timeout: 60000
    connection-timeout: 30000
    conversation-turn: 2

app:
  frontend:
    url: ${FRONTEND_URL}

rate-limit:
  enabled: true
  limit-for-period: 100
  period-in-seconds: 60

springdoc:
  swagger-ui:
    tags-sorter: alpha

spring:
  application:
    name: backend

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/texttosql}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false

  sql:
    init:
      #      mode: always
      mode: never

  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    time-zone: UTC
    default-property-inclusion: non_null

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=30m

token:
  email-verification:
    expiration: 30m
  password-reset:
    expiration: 5m
  jwt:
    secret: ${JWT_SECRET}
    refresh:
      expiration: ${JWT_REFRESH_EXPIRATION}
    access:
      expiration: ${JWT_ACCESS_EXPIRATION}

guest:
  email:
    domain: "@texttosql.local.com"

logging:
  level:
    root: ${LOG_LEVEL}
    com.texttosql.backend: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/backend.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
    metrics:
      access: read_only
  health:
    db:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

info:
  app:
    name: Text-to-SQL Backend
    description: Backend service for Text-to-SQL platform
    version: 1.0.0