server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

llm:
  service:
    url: http://localhost:8000
    endpoint: /predict
    read-timeout: 60000
    connection-timeout: 50000
    conversation-turn: 2

api-gateway:
  service:
    url: http://localhost:5173

spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/texttosql
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false

  sql:
    init:
      mode: always

  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    time-zone: UTC
    default-property-inclusion: non_null

jwt:
  secret: c5e163309292b0cc856f4a955d48e07b5e9f6fefd490c1dcd703efbb3eae065e
  expiration: 86400000

logging:
  level:
    root: INFO
    com.texttosql.backend: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/backend.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
    metrics:
      access: read_only
  health:
    db:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

info:
  app:
    name: Text-to-SQL Backend
    description: Backend service for Text-to-SQL platform
    version: 1.0.0