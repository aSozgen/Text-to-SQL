version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: texttosql-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432:5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  llm:
    build:
      context: llm-server/texttosql
      dockerfile: servers/v1-2-3/Dockerfile
    container_name: texttosql-llm
    restart: unless-stopped
    ports:
      - "${LLM_PORT:-8000}:8000"
    volumes:
      - ./llm-server/texttosql/models/v3:/app/models/v3:ro
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MODEL_PATH: /app/models/v3
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - MAVEN_OPTS=-Xmx512m
    container_name: texttosql-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      llm:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      # Database
      POSTGRES_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # LLM Service
      LLM_URL: http://llm:8000
      # Frontend
      FRONTEND_URL: ${FRONTEND_URL}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      # Email
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    volumes:
      - backend_logs:/app/logs

networks:
  app-network:
    driver: bridge
    name: texttosql-network

volumes:
  postgres_data:
    name: texttosql-postgres-data
  backend_logs:
    name: texttosql-backend-logs