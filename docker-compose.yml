services:
  db:
    image: postgres:15-alpine
    container_name: texttosql-postgres
    restart: no
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432:5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  ollama:
    image: ollama/ollama:latest
    container_name: texttosql-ollama
    restart: no
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    volumes:
      - ollama_data:/root/.ollama  # İndirilen model silinmesin diye diske kaydedilir
    networks:
      - app-network
    # GPU KULLANIMI İÇİN ŞART OLAN KISIM:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  ollama-init:
    image: curlimages/curl:latest
    container_name: texttosql-ollama-init
    depends_on:
      ollama:
        condition: service_started
    networks:
      - app-network
    # Ollama'nın tam açılması için sleep süresi 15 saniyeye çıkarıldı ve model tam adı kullanıldı
    command: >
      sh -c "sleep 15 && curl -X POST http://ollama:11434/api/pull -d '{\"model\": \"hf.co/abdlkdr/QueryGen_Qwen2.5_Coder_v1.2\"}'"

  llm:
    build:
      context: llm-server/texttosql
      dockerfile: servers/v5/Dockerfile
    container_name: texttosql-llm
    restart: no
    depends_on:
      ollama-init:
        condition: service_completed_successfully # BAŞARILI BİR ŞEKİLDE MODEL İNMEDEN LLM BAŞLAMASIN
    ports:
      - "${LLM_PORT:-8000}:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OLLAMA_BASE_URL: http://ollama:11434
      MODEL_NAME: "${MODEL_PATH:-hf.co/abdlkdr/QueryGen_Qwen2.5_Coder_v1.2}"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 20s      # Timeout artırıldı
      retries: 10       # Deneme sayısı artırıldı (modelin belleğe yüklenmesi zaman alabilir)
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: '2'      # Python/LLM servisi için CPU limiti 1'den 2'ye çıkarıldı
          memory: 2G     # Bellek 512M'den 2G'ye çıkarıldı (Out of Memory hatalarını önlemek için)

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - MAVEN_OPTS=-Xmx512m
    container_name: texttosql-backend
    restart: no
    depends_on:
      db:
        condition: service_healthy
      llm:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      # Database
      POSTGRES_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # LLM Service
      LLM_URL: ${LLM_URL}
      # Frontend
      FRONTEND_URL: ${FRONTEND_URL}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      # Email
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    volumes:
      - backend_logs:/app/logs

  frontend:
    build:
      context: ./frontend/texttosql
      dockerfile: Dockerfile
    container_name: texttosql-frontend
    restart: no
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  app-network:
    driver: bridge
    name: texttosql-network

volumes:
  postgres_data:
    name: texttosql-postgres-data
  backend_logs:
    name: texttosql-backend-logs
  ollama_data:
    name: textosql-ollama-data