<!--navbar.component.html-->

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid px-4">

    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/">
      <span class="fw-bold text-white fs-4">
        <i class="fa-solid fa-database" style="color: var(--accent-green);"></i>QueryGen
      </span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" routerLink="/home" routerLinkActive="active">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/chat" routerLinkActive="active">Chat</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/schemas" routerLinkActive="active">Schemas</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/help" routerLinkActive="active">Help</a>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-3">
        @if (authService.currentUser()) {
          <div class="dropdown">
            <a class="d-flex align-items-center text-decoration-none dropdown-toggle no-arrow user-profile-link"
               id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false" role="button" style="cursor: pointer;">
              <div class="user-avatar">
                {{ authService.userInitials() }}
              </div>
              <span class="d-none d-lg-block ms-2 text-white small fw-bold">
                {{ authService.currentUser()?.username }}
              </span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark shadow mt-3" aria-labelledby="profileDropdown">
              <li><a class="dropdown-item" routerLink="/profile"><i class="fas fa-user me-2"></i>Profile</a></li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <button class="dropdown-item text-danger" type="button" (click)="logout()">
                  <i class="fas fa-sign-out-alt me-2"></i>Log out
                </button>
              </li>
            </ul>
          </div>
        } @else {
          <div class="d-flex gap-2 align-items-center">
            <a routerLink="/login" class="btn btn-login btn-sm fw-bold px-3">Log in</a>
            <a routerLink="/register" class="btn btn-register btn-sm fw-bold px-3">Register</a>
          </div>
        }
      </div>
    </div>
  </div>
</nav>
